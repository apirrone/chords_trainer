[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "chords-trainer"
version = "0.1.0"
authors = [{ name = "Antoine Pirrone", email = "antoine.pirrone@gmail.com" }]
description = "Chords Trainer (TODO description)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["pygame==2.5.2", "mido[ports-rtmidi]==1.3.2", "sounddevice==0.5.2"]


[project.scripts]
chords-trainer = "chords_trainer.main:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true


[tool.setuptools.packages.find]
where = ["src"]
